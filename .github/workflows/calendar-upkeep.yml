name: Calendar upkeep

# Closes the RSI loop in the system rather than in a human's memory:
#   1. verifies the assembled system prompt still matches its layers
#   2. verifies the date engine still reproduces the ground truth
#   3. rolls the feed's horizon forward and opens a PR only if it actually changed
#
# The .ics output is deterministic (DTSTAMP derives from each event's year, not
# from "now"), so an unchanged engine + unchanged horizon produces a byte-identical
# file and this workflow stays silent.

on:
  schedule:
    - cron: "0 7 1 * *"   # 07:00 UTC on the 1st of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "calendars/ekadashi/**"
      - "docs/system-prompt-stack/**"
      - ".github/workflows/calendar-upkeep.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: calendar-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ephem

      # --- self-measurement: these fail the job loudly -------------------
      - name: Check assembled prompt matches its layers
        run: python3 assemble.py --check
        working-directory: docs/system-prompt-stack

      - name: Validate date engine against ground truth
        run: python3 ekadashi.py validate
        working-directory: calendars/ekadashi

      # --- rolling horizon ----------------------------------------------
      # Always cover the current year through +2, so the feed never silently
      # runs out. Computed, never hardcoded.
      - name: Regenerate feed on a rolling horizon
        working-directory: calendars/ekadashi
        run: |
          set -euo pipefail
          Y0=$(date -u +%Y)
          Y1=$((Y0 + 2))
          echo "Regenerating feed for ${Y0}-${Y1}"
          python3 ekadashi.py generate \
            --from "$Y0" --to "$Y1" \
            --lat 47.6062 --lon -122.3321 \
            --tz America/Los_Angeles --place "Seattle, WA"

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- calendars/ekadashi/ekadashi.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Feed is current; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- calendars/ekadashi/ekadashi.ics
          fi

      # --- surface the correction actively, don't wait to be asked ------
      - name: Open or update the correction PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=automation/calendar-upkeep
          Y0=$(date -u +%Y); Y1=$((Y0 + 2))

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add calendars/ekadashi/ekadashi.ics
          git commit -m "Roll Ekadashi feed horizon to ${Y0}-${Y1}"
          git push --force-with-lease -u origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "Roll Ekadashi feed horizon to ${Y0}-${Y1}" \
              --body "Automated upkeep. The engine passed validation against the ground truth, then regenerated the feed to cover **${Y0}-${Y1}**.

          The committed feed differed from the freshly generated one, so this PR carries the correction. Review the diff and merge to keep the subscribed calendar current.

          Generated by \`.github/workflows/calendar-upkeep.yml\`."
          else
            echo "PR already open for $BRANCH; force-push updated it."
          fi
